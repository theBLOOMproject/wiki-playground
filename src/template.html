<style>
:root {
  --bg: #FFFFFF;
  --surface: #F3F6FA;
  --surface-2: #E7EDF5;
  --line: #D8E0EB;
  --ink: #1E2B3C;
  --muted: #5A6A7E;
  --blue: #1D5BA6;
  --blue-strong: #164A8A;
  --blue-soft: #E1EBF8;
  --orange: #B3570A;
  --orange-bright: #E8792A;
  --orange-soft: #FDF1E6;
  --img-bg: #FFFFFF;
  --shadow: 0 1px 2px rgba(30, 43, 60, 0.06);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111923;
    --surface: #17212D;
    --surface-2: #1F2B3A;
    --line: #2A3848;
    --ink: #E5EBF2;
    --muted: #9AA9BA;
    --blue: #8FBAF0;
    --blue-strong: #B3D0F5;
    --blue-soft: #1D3150;
    --orange: #F3A464;
    --orange-bright: #F08C3E;
    --orange-soft: #33261A;
    --img-bg: #F4F6F9;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111923;
  --surface: #17212D;
  --surface-2: #1F2B3A;
  --line: #2A3848;
  --ink: #E5EBF2;
  --muted: #9AA9BA;
  --blue: #8FBAF0;
  --blue-strong: #B3D0F5;
  --blue-soft: #1D3150;
  --orange: #F3A464;
  --orange-bright: #F08C3E;
  --orange-soft: #33261A;
  --img-bg: #F4F6F9;
  --shadow: none;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 16px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--orange); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--orange-bright) 45%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
a:hover { text-decoration-color: var(--orange-bright); }
:focus-visible { outline: 3px solid var(--orange-bright); outline-offset: 2px; border-radius: 6px; }
h1[tabindex="-1"]:focus { outline: none; }
img { max-width: 100%; height: auto; }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100%; }

.sidebar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  align-self: start;
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 30px 18px 40px 22px;
}
.brand { display: block; text-decoration: none; padding: 0 6px 22px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand-title { display: block; font-weight: 800; font-size: 1.4rem; line-height: 1.15; color: var(--blue); letter-spacing: -0.01em; }
.brand-sub { display: block; margin-top: 6px; font-size: 0.86rem; line-height: 1.35; color: var(--muted); font-weight: 600; }

.nav, .nav ul { list-style: none; margin: 0; padding: 0; }
.nav > li { margin-bottom: 2px; }
.nav-link {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 10px; border-radius: 10px;
  color: var(--ink); text-decoration: none; font-weight: 700; font-size: 0.95rem; line-height: 1.35;
}
.nav-link:hover { background: var(--surface-2); }
.nav-link .num {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  display: inline-grid; place-items: center;
  background: var(--bg); border: 1.5px solid var(--line);
  font-size: 0.78rem; font-weight: 800; color: var(--muted); margin-top: -1px;
}
.nav-link .home-icon { flex: none; width: 24px; height: 24px; display: inline-grid; place-items: center; color: var(--muted); }
.nav-link[aria-current="page"], .nav-section.current > .nav-link { color: var(--blue); }
.nav-link[aria-current="page"] { background: var(--blue-soft); }
.nav-section.current > .nav-link .num { background: var(--blue); border-color: var(--blue); color: var(--bg); }
.nav-pages { margin: 2px 0 10px 21px !important; padding-left: 0; border-left: 2px solid var(--line); }
.nav-section:not(.current) > .nav-pages { display: none; }
.nav-pages a {
  position: relative; display: flex; align-items: baseline; gap: 8px;
  margin-left: 0; padding: 6px 10px 6px 18px; border-radius: 0 10px 10px 0;
  color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 600; line-height: 1.35;
}
.nav-pages a::before {
  content: ""; position: absolute; left: -6px; top: 13px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--line);
}
.nav-pages a:hover { color: var(--ink); background: var(--surface-2); }
.nav-pages a[aria-current="page"] { color: var(--blue); font-weight: 800; background: var(--blue-soft); }
.nav-pages a[aria-current="page"]::before { background: var(--blue); border-color: var(--blue); }
.soon-tag { margin-left: auto; flex: none; font-size: 0.7rem; font-weight: 700; color: var(--muted); background: var(--surface-2); padding: 1px 7px; border-radius: 999px; }
.nav-pages a[aria-current="page"] .soon-tag { background: var(--bg); }

.main { min-width: 0; }
.content { max-width: 880px; margin: 0 auto; padding: 52px 56px 88px; }

/* ---------- Mobile top bar ---------- */
.topbar { display: none; }
.backdrop { display: none; }

/* ---------- Page header ---------- */
.crumb { margin: 0 0 8px; font-size: 0.92rem; font-weight: 700; color: var(--muted); }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--blue); }
h1 { margin: 0; font-weight: 800; font-size: clamp(1.8rem, 1.3rem + 1.6vw, 2.35rem); line-height: 1.18; letter-spacing: -0.015em; color: var(--blue); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 14px 0 0; font-size: 0.9rem; color: var(--muted); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 11px; border-radius: 999px; font-size: 0.8rem; font-weight: 800; line-height: 1.6; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.draft { color: var(--blue); background: var(--blue-soft); }
.pill.soon { color: var(--muted); background: var(--surface-2); }

h2 { margin: 2.4em 0 0.6em; font-size: 1.45rem; line-height: 1.25; font-weight: 800; color: var(--blue); letter-spacing: -0.01em; }
h3 { margin: 1.9em 0 0.4em; font-size: 1.14rem; line-height: 1.3; font-weight: 800; color: var(--blue-strong); }
p { margin: 0 0 1em; }
.content ul, .content ol { padding-left: 1.3em; margin: 0 0 1.1em; }
.content li { margin-bottom: 0.4em; }
.content li::marker { color: var(--blue); }
strong { font-weight: 800; }
.lead { font-size: 1.12rem; line-height: 1.6; }

/* ---------- Key points ---------- */
.keypoints { margin: 30px 0 36px; padding: 22px 26px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; position: relative; }
.keypoints h2 { margin: 0 0 10px; font-size: 1.05rem; color: var(--blue); }
.keypoints ul { padding-left: 1.15em !important; }
.keypoints li { margin-bottom: 0.55em; }

/* ---------- Callouts ---------- */
.callout { margin: 1.6em 0; padding: 18px 22px; border-radius: 14px; background: var(--blue-soft); color: var(--ink); }
.callout p:last-child { margin-bottom: 0; }
.callout-title { font-weight: 800; color: var(--blue); margin-bottom: 4px !important; }
.quote { margin: 1.6em 0; padding: 4px 0 4px 22px; border-left: 4px solid var(--orange-bright); font-size: 1.12rem; line-height: 1.55; font-weight: 600; }
.quote footer { margin-top: 8px; font-size: 0.86rem; font-weight: 600; color: var(--muted); }
.pending { display: inline-block; vertical-align: 1px; margin-left: 4px; padding: 0 8px; border: 1.5px dashed var(--orange-bright); border-radius: 999px; font-size: 0.72rem; font-weight: 800; line-height: 1.55; color: var(--orange); background: var(--orange-soft); white-space: nowrap; }

/* ---------- Figures ---------- */
figure { margin: 2em 0; }
figcaption { margin-top: 10px; font-size: 0.88rem; line-height: 1.5; color: var(--muted); }
.figure-img { display: block; padding: 14px; background: var(--img-bg); border: 1px solid var(--line); border-radius: 16px; }
.figure-img img { display: block; margin: 0 auto; border-radius: 6px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; margin: 1.4em 0 1.8em; border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 0.93rem; line-height: 1.5; }
th, td { text-align: left; vertical-align: top; padding: 12px 16px; border-bottom: 1px solid var(--line); }
thead th { background: var(--surface); color: var(--blue); font-weight: 800; white-space: nowrap; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
tbody th { font-weight: 800; color: var(--ink); white-space: nowrap; }
.wide-table table { font-size: 0.86rem; }
.wide-table th, .wide-table td { padding: 12px 14px; }
.wide-table tbody th, .wide-table thead th { white-space: normal; }

/* ---------- Engagement timeline ---------- */
.phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; position: relative; }
.phase { position: relative; padding: 18px 18px 16px; background: var(--surface); border: 1px solid var(--line); }
.phase:first-child { border-radius: 16px 0 0 16px; }
.phase:last-child { border-radius: 0 16px 16px 0; }
.phase + .phase { border-left: 0; }
.phase + .phase::before {
  content: ""; position: absolute; left: -11px; top: 26px; width: 20px; height: 20px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 50%; z-index: 1;
}
.phase + .phase::after {
  content: ""; position: absolute; left: -4px; top: 33px; width: 6px; height: 6px;
  border-top: 2px solid var(--orange-bright); border-right: 2px solid var(--orange-bright); transform: rotate(45deg); z-index: 2;
}
.phase-name { margin: 0; font-weight: 800; font-size: 1.15rem; color: var(--blue); }
.phase-when { margin: 0 0 12px; font-size: 0.84rem; color: var(--muted); font-weight: 600; }
.stages { list-style: none; padding: 0 !important; margin: 0 !important; display: grid; gap: 8px; }
.stages li { margin: 0; padding: 8px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; font-size: 0.9rem; line-height: 1.35; }
.stages li strong { display: block; color: var(--ink); }
.stages li span { color: var(--muted); font-size: 0.84rem; }

/* ---------- Arnstein ladder ---------- */
.ladder { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 16px; max-width: 560px; }
.ladder-group { grid-column: 1; display: flex; align-items: center; justify-content: flex-end; text-align: right; font-size: 0.84rem; font-weight: 800; line-height: 1.25; color: var(--muted); padding: 6px 0; border-right: 3px solid var(--line); padding-right: 12px; }
.ladder-group.power { color: var(--blue); border-right-color: var(--blue); }
.ladder-group.token { color: var(--orange); border-right-color: var(--orange-bright); }
.ladder-rungs { grid-column: 2; display: grid; gap: 6px; padding: 6px 0; }
.rung { display: flex; align-items: flex-start; gap: 12px; padding: 8px 14px; border-radius: 3px 10px 10px 3px; border-left: 4px solid; font-size: 0.93rem; }
.rung b { font-weight: 800; flex: none; width: 1.3em; color: var(--muted); }
.rung.power { background: var(--blue-soft); border-color: var(--blue); }
.rung.token { background: var(--orange-soft); border-color: var(--orange-bright); }
.rung.non { background: var(--surface); border-color: var(--line); color: var(--muted); }

/* ---------- Coming soon ---------- */
.soon-card { margin: 32px 0; padding: 26px 28px 14px; border: 2px dashed var(--line); border-radius: 18px; background: var(--surface); }
.soon-card .soon-title { margin: 0 0 6px; font-weight: 800; font-size: 1.2rem; color: var(--blue); }

/* ---------- Pager ---------- */
.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 64px; padding-top: 28px; border-top: 1px solid var(--line); }
.pager a { display: block; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; background: var(--bg); }
.pager a:hover { border-color: var(--orange-bright); background: var(--orange-soft); }
.pager .dir { display: block; font-size: 0.84rem; font-weight: 800; color: var(--orange); }
.pager .ttl { display: block; margin-top: 2px; font-weight: 700; color: var(--ink); line-height: 1.35; }
.pager .next { grid-column: 2; text-align: right; }

/* ---------- Home ---------- */
.home-title { font-size: clamp(2.4rem, 1.6rem + 3vw, 3.4rem); line-height: 1.05; letter-spacing: -0.025em; }
.home-sub { margin: 10px 0 0; font-size: 1.15rem; font-weight: 700; color: var(--muted); }
.home-desc { margin: 26px 0 0; font-size: 1.12rem; line-height: 1.6; max-width: 58ch; }
.home-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin: 28px 0 0; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px; background: var(--blue); color: var(--bg); font-weight: 800; text-decoration: none; }
.btn:hover { background: var(--blue-strong); }
.home-progress { font-size: 0.93rem; color: var(--muted); font-weight: 600; }
.outline { margin-top: 48px; }
.outline-section { margin-bottom: 30px; }
.outline-head { display: flex; align-items: center; gap: 12px; margin: 0 0 8px; font-size: 1.15rem; }
.outline-head .num { flex: none; width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--blue); color: var(--bg); font-size: 0.9rem; font-weight: 800; }
.outline-list { list-style: none; padding: 0 !important; margin: 0 0 0 15px !important; border-left: 2px solid var(--line); }
.outline-list li { margin: 0; }
.outline-row { display: grid; grid-template-columns: minmax(0, 1fr) 108px 74px; align-items: center; gap: 14px; padding: 10px 12px 10px 27px; border-bottom: 1px solid var(--line); }
.outline-list li:last-child .outline-row { border-bottom: 0; }
.outline-row a { font-weight: 700; line-height: 1.4; text-decoration: none; color: var(--ink); }
.outline-row a:hover { color: var(--orange); text-decoration: underline; text-decoration-color: var(--orange-bright); }
.outline-row .pill { justify-self: start; }
.outline-row .time { text-align: right; font-size: 0.86rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
.home-note { margin-top: 36px; padding: 16px 20px; border-radius: 14px; background: var(--surface); font-size: 0.92rem; color: var(--muted); }
.home-note p { margin: 0; }

/* ---------- Responsive ---------- */
@media (max-width: 960px) {
  .layout { display: block; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--surface); }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
  .topbar-brand { text-decoration: none; line-height: 1.15; min-width: 0; }
  .topbar-brand b { display: block; color: var(--blue); font-weight: 800; font-size: 1.08rem; }
  .topbar-brand span { display: block; color: var(--muted); font-size: 0.78rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-btn { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-weight: 800; font-size: 0.9rem; cursor: pointer; }
  .sidebar {
    position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; height: auto; align-self: stretch;
    width: min(330px, 86vw);
    padding-top: calc(env(safe-area-inset-top, 0px) + 26px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
    transform: translateX(-102%); transition: transform 220ms ease; box-shadow: none;
  }
  body.nav-open .sidebar { transform: none; box-shadow: 0 0 40px rgba(0,0,0,0.18); }
  .backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(17, 25, 35, 0.35); }
  body.nav-open .backdrop { display: block; }
  .content { padding: 32px 22px 72px; }
}
@media (max-width: 600px) {
  body { font-size: 16.5px; }
  .actors { grid-template-columns: 1fr; }
  .phases { grid-template-columns: 1fr; }
  .phase:first-child { border-radius: 16px 16px 0 0; }
  .phase:last-child { border-radius: 0 0 16px 16px; }
  .phase + .phase { border-left: 1px solid var(--line); border-top: 0; }
  .phase + .phase::before { left: 22px; top: -11px; }
  .phase + .phase::after { left: 29px; top: -4px; transform: rotate(135deg); }
  .layer { grid-template-columns: 1fr; gap: 4px; }
  .layer:nth-child(n) { margin: 0; }
  .ladder { grid-template-columns: 1fr; }
  .ladder-group { justify-content: flex-start; text-align: left; border-right: 0; padding: 12px 0 2px; }
  .ladder-group, .ladder-rungs { grid-column: 1; }
  .outline-row { grid-template-columns: minmax(0, 1fr) auto; padding-left: 20px; }
  .outline-row .time { grid-column: 2; }
  .outline-row .pill { grid-column: 1; grid-row: 2; justify-self: start; }
  .outline-row a { grid-column: 1 / -1; }
  .pager { grid-template-columns: 1fr; }
  .pager .next { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- Editor notes ---------- */
.ed.flag {
  display: inline; padding: 1px 7px; margin: 0 1px;
  border: 1.5px dashed var(--orange-bright); border-radius: 7px;
  background: var(--orange-soft); color: var(--ink);
  font-size: 0.8rem; font-weight: 500; line-height: 1.75;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.ed.flag b { color: var(--orange); font-weight: 800; margin-right: 1px; }
.ed.flag a { color: inherit; }
.ed.flag-team { border-color: color-mix(in srgb, var(--blue) 45%, transparent); background: var(--blue-soft); }
.ed.flag-team b { color: var(--blue); }
.ed.flag-new { border-style: solid; border-color: var(--line); background: var(--surface); color: var(--muted); }
.ed.flag-new b { color: var(--muted); }
.ed.src { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.ed.src::before { content: "["; }
.ed.src::after { content: "]"; }
.ed.src a { color: var(--muted); }
body.hide-ed .ed, body.hide-ed .edw, body.hide-ed .ed-block { display: none !important; }

/* ---------- Content extras ---------- */
h4 { margin: 1.6em 0 0.3em; font-size: 1.02rem; font-weight: 800; color: var(--ink); }
.lead-strong { font-size: 1.06rem; }
.lead-strong strong { font-weight: 700; color: var(--ink); }
.sources { font-size: 0.86rem; color: var(--muted); line-height: 1.6; }
.sources em { font-style: normal; }
td strong { color: var(--ink); }
tbody td:first-child { font-weight: 700; }
.pill { white-space: nowrap; }
article[data-page="review-notes"] h1 { margin-bottom: 22px; }
.outline-row { grid-template-columns: minmax(0, 1fr) 122px 74px; }
.content ol > li::marker { font-weight: 800; color: var(--blue); }

.facts { display: grid; grid-template-columns: 170px minmax(0, 1fr); margin: 1.4em 0 1.8em; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.facts dt { padding: 12px 16px; background: var(--surface); color: var(--blue); font-weight: 800; font-size: 0.9rem; line-height: 1.4; border-bottom: 1px solid var(--line); }
.facts dd { margin: 0; padding: 12px 16px; font-size: 0.95rem; line-height: 1.55; border-bottom: 1px solid var(--line); }
.facts dt:nth-last-of-type(1), .facts dd:last-child { border-bottom: 0; }

.tl { list-style: none; padding: 4px 0 0 !important; margin: 1.2em 0 1.8em 6px !important; border-left: 2px solid var(--line); }
.tl li { position: relative; margin: 0 !important; padding: 0 0 18px 24px; font-size: 0.96rem; }
.tl li:last-child { padding-bottom: 2px; }
.tl li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--blue); }
.tl .when { display: block; font-weight: 800; color: var(--blue); font-size: 0.92rem; margin-bottom: 2px; }

.rung strong { display: block; font-weight: 800; }
.rung span { display: block; font-size: 0.86rem; line-height: 1.4; color: var(--muted); }
.rung.non strong { color: var(--muted); }

.case-cards { display: grid; gap: 12px; margin: 1.6em 0 2em; }
.case-card { display: block; padding: 16px 20px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; background: var(--bg); }
.case-card:hover { border-color: var(--orange-bright); background: var(--orange-soft); }
.cc-title { display: block; font-weight: 800; color: var(--blue); font-size: 1.05rem; line-height: 1.35; }
.cc-desc { display: block; margin-top: 4px; color: var(--ink); font-size: 0.95rem; line-height: 1.5; }

/* ---------- Sidebar extras ---------- */
.nav-pages a.sub { padding-left: 34px; font-size: 0.85rem; }
.nav-pages a.sub::before { left: 13px; top: 12px; width: 8px; height: 8px; border-width: 1.5px; }
.side-foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; color: var(--ink); cursor: pointer; }
.switch:hover { background: var(--surface-2); }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .track { flex: none; position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--line); transition: background 150ms; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); transition: transform 150ms; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
.switch input:checked + .track { background: var(--orange-bright); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 3px solid var(--orange-bright); outline-offset: 2px; }
.switch-hint { padding: 0 10px; font-size: 0.78rem; line-height: 1.4; color: var(--muted); }

/* ---------- Home extras ---------- */
.outline-list li.sub .outline-row { padding-left: 46px; }
.outline-list li.sub .outline-row a { font-weight: 600; font-size: 0.95rem; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; }

@media (max-width: 600px) {
  .facts { grid-template-columns: 1fr; }
  .facts dt { border-bottom: 0; padding-bottom: 2px; }
  .wide-table table { min-width: 620px; }
  .outline-list li.sub .outline-row { padding-left: 34px; }
}
</style>
</head>
<body>

<header class="topbar">
  <a class="topbar-brand" href="#home"><b>Learning Center</b><span>Central Oregon Civic Assembly on AI</span></a>
  <button class="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false" id="menuBtn">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Contents
  </button>
</header>
<div class="backdrop" id="backdrop"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Contents">
    <a class="brand" href="#home">
      <span class="brand-title">Learning Center</span>
      <span class="brand-sub">Central Oregon Civic Assembly on AI</span>
    </a>
    <nav aria-label="Learning Center pages"><ul class="nav" id="nav"></ul></nav>
    <div class="side-foot">
      <a class="nav-link" href="#review-notes" data-target="review-notes"><span class="home-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5h6l2.5 2.5v8.5H4z M9.5 2.5V5.5h3 M6 8.5h4.5 M6 11h4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span>Review notes</a>
      <label class="switch"><span>Editor notes</span><input type="checkbox" id="edToggle" checked><span class="track" aria-hidden="true"></span></label>
      <p class="switch-hint">Flags, gaps, and internal sources from the working drafts</p>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="content" id="content">
<!-- ARTICLES -->
    </div>
  </main>
</div>

<script>
(function () {
  var SECTIONS = /* SECTIONS */[];
  var articles = {};
  document.querySelectorAll("article[data-page]").forEach(function (a) { articles[a.dataset.page] = a; });

  function words(art) {
    var c = art.cloneNode(true);
    c.querySelectorAll(".ed, .edw, .ed-block, figure").forEach(function (n) { n.remove(); });
    return (c.textContent || "").trim().split(/\s+/).length;
  }

  var ORDER = [];
  SECTIONS.forEach(function (s) {
    s.pages = s.pages.map(function (a) {
      var art = articles[a[0]];
      var p = { id: a[0], nav: a[1], sub: !!a[2], section: s };
      p.status = art.dataset.status === "draft" ? "draft" : "soon";
      p.title = art.querySelector("h1").textContent.trim();
      p.minutes = p.status === "draft" ? Math.max(1, Math.round(words(art) / 220)) : null;
      ORDER.push(p);
      return p;
    });
  });
  var byId = {};
  ORDER.forEach(function (p) { byId[p.id] = p; });

  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  // ---------- Sidebar ----------
  var nav = document.getElementById("nav");
  var homeLi = el("li");
  homeLi.appendChild(el("a", { class: "nav-link", href: "#home", "data-target": "home" },
    '<span class="home-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2.5 7.2 8 2.5l5.5 4.7V13a.8.8 0 0 1-.8.8H9.8V10H6.2v3.8H3.3a.8.8 0 0 1-.8-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>Home'));
  nav.appendChild(homeLi);
  SECTIONS.forEach(function (s) {
    var li = el("li", { class: "nav-section", "data-section": s.num });
    var first = s.pages[0];
    li.appendChild(el("a", { class: "nav-link", href: "#" + first.id, "data-target": s.single ? first.id : "" },
      '<span class="num" aria-hidden="true">' + s.num + "</span><span>" + esc(s.title) + "</span>"));
    if (!s.single) {
      var ul = el("ul", { class: "nav-pages" });
      s.pages.forEach(function (p) {
        var pli = el("li");
        pli.appendChild(el("a", { href: "#" + p.id, "data-target": p.id, class: p.sub ? "sub" : "" },
          "<span>" + esc(p.nav) + "</span>" + (p.status === "soon" ? '<span class="soon-tag">Soon</span>' : "")));
        ul.appendChild(pli);
      });
      li.appendChild(ul);
    }
    nav.appendChild(li);
  });

  // ---------- Home outline ----------
  var outline = document.getElementById("outline");
  var drafted = 0, totalMin = 0;
  SECTIONS.forEach(function (s) {
    var wrap = el("section", { class: "outline-section" });
    wrap.appendChild(el("h2", { class: "outline-head" }, '<span class="num" aria-hidden="true">' + s.num + "</span>" + esc(s.title)));
    var ul = el("ul", { class: "outline-list" });
    s.pages.forEach(function (p) {
      if (p.status === "draft") { drafted++; totalMin += p.minutes; }
      var li = el("li", p.sub ? { class: "sub" } : null);
      li.appendChild(el("div", { class: "outline-row" },
        '<a href="#' + p.id + '">' + esc(p.title) + "</a>" +
        (p.status === "draft" ? '<span class="pill draft">Draft</span>' : '<span class="pill soon">Coming soon</span>') +
        '<span class="time">' + (p.minutes ? p.minutes + " min read" : "—") + "</span>"));
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
    outline.appendChild(wrap);
  });
  document.getElementById("homeProgress").textContent =
    drafted + " of " + ORDER.length + " pages drafted, about " + totalMin + " minutes of reading so far";

  // ---------- Page chrome ----------
  ORDER.forEach(function (p, i) {
    var art = articles[p.id];
    var h1 = art.querySelector("h1");
    if (!p.section.single) {
      art.insertBefore(el("p", { class: "crumb" }, '<a href="#' + p.section.pages[0].id + '">' + esc(p.section.title) + "</a>"), h1);
    }
    h1.insertAdjacentElement("afterend", el("p", { class: "meta" },
      p.status === "draft" ? '<span class="pill draft">Draft</span><span>' + p.minutes + " min read</span>"
                           : '<span class="pill soon">Coming soon</span>'));
    var prev = i === 0 ? { id: "home", title: "Home" } : ORDER[i - 1];
    var next = ORDER[i + 1];
    var pager = el("nav", { class: "pager", "aria-label": "Previous and next page" });
    pager.appendChild(el("a", { class: "prev", href: "#" + prev.id },
      '<span class="dir"><span aria-hidden="true">←</span> Previous</span><span class="ttl">' + esc(prev.title) + "</span>"));
    if (next) pager.appendChild(el("a", { class: "next", href: "#" + next.id },
      '<span class="dir">Next <span aria-hidden="true">→</span></span><span class="ttl">' + esc(next.title) + "</span>"));
    art.appendChild(pager);
  });
  var homePager = el("nav", { class: "pager", "aria-label": "Next page" });
  homePager.appendChild(el("a", { class: "next", href: "#" + ORDER[0].id },
    '<span class="dir">Next <span aria-hidden="true">→</span></span><span class="ttl">' + esc(ORDER[0].title) + "</span>"));
  articles.home.appendChild(homePager);
  var rn = articles["review-notes"];
  rn.insertBefore(el("p", { class: "crumb" }, "For the team"), rn.querySelector("h1"));

  document.querySelectorAll('a[href^="http"]').forEach(function (a) {
    a.setAttribute("target", "_blank");
    a.setAttribute("rel", "noopener noreferrer");
  });

  // ---------- Editor notes switch ----------
  var tog = document.getElementById("edToggle");
  var saved = null;
  try { saved = localStorage.getItem("lc-editor-notes"); } catch (e) {}
  if (saved === "off") tog.checked = false;
  function applyEd() {
    document.body.classList.toggle("hide-ed", !tog.checked);
    try { localStorage.setItem("lc-editor-notes", tog.checked ? "on" : "off"); } catch (e) {}
  }
  tog.addEventListener("change", applyEd);
  applyEd();

  // ---------- Routing ----------
  var current = null;
  function show(id, fromHash) {
    if (!articles[id]) id = "home";
    if (current === id) return;
    current = id;
    Object.keys(articles).forEach(function (k) { articles[k].hidden = k !== id; });
    var page = byId[id];
    document.querySelectorAll("#sidebar a[data-target]").forEach(function (a) {
      if (a.dataset.target === id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    document.querySelectorAll(".nav-section").forEach(function (li) {
      li.classList.toggle("current", !!page && String(page.section.num) === li.dataset.section);
    });
    var t = articles[id].querySelector("h1");
    document.title = (id !== "home" ? t.textContent.trim() + " | " : "") + "Learning Center | Central Oregon Civic Assembly on AI";
    window.scrollTo(0, 0);
    closeNav();
    if (fromHash && t) { t.setAttribute("tabindex", "-1"); t.focus({ preventScroll: true }); }
  }
  function route(fromHash) { show((location.hash || "").replace(/^#/, "") || "home", fromHash); }
  window.addEventListener("hashchange", function () { route(true); });

  // ---------- Mobile drawer ----------
  var btn = document.getElementById("menuBtn");
  var backdrop = document.getElementById("backdrop");
  function openNav() { document.body.classList.add("nav-open"); btn.setAttribute("aria-expanded", "true"); var a = document.querySelector("#sidebar a"); if (a) a.focus(); }
  function closeNav() { if (!document.body.classList.contains("nav-open")) return; document.body.classList.remove("nav-open"); btn.setAttribute("aria-expanded", "false"); }
  btn.addEventListener("click", function () { document.body.classList.contains("nav-open") ? closeNav() : openNav(); });
  backdrop.addEventListener("click", closeNav);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeNav(); });
  document.getElementById("sidebar").addEventListener("click", function (e) {
    var a = e.target.closest("a");
    if (a && a.getAttribute("href") === location.hash) closeNav();
  });

  route(false);
})();
</script>
</body>
</html>
